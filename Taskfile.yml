version: '3'

vars:
  BINARY_NAME: edgeproxy
  VERSION: 1.0.0
  LDFLAGS: -s -w -X main.Version={{.VERSION}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build EdgeProxy binary for current OS
    cmds:
      - CGO_ENABLED=0 go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} ./cmd/app/main.go
      - echo "Built ./{{.BINARY_NAME}}"

  clean:
    desc: Remove built binary
    cmds:
      - rm -f {{.BINARY_NAME}}